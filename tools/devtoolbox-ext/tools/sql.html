<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL 格式化 · DevToolbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M13 9l-4 7 4 7M19 9l4 7-4 7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/app.css?v=202610271643">
<script src="../js/app.js?v=202610271643"></script>
<script src="../js/sqlfmt.js?v=202610271643"></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <a class="brand-link" href="../index.html" title="返回首页">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6L4 12l5 6M15 6l5 6-5 6"/>
          </svg>
        </div>
        <div>
          <h1>SQL 格式化</h1>
          <p class="sub">粘贴 SQL，一键排版；关键字、字符串、注释分色显示</p>
        </div>
      </a>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="切换浅色 / 深色" aria-label="切换主题">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="opts">
      <div class="opt">
        <span class="opt-label">缩进</span>
        <div class="seg" id="segIndent" role="group" aria-label="缩进宽度">
          <button data-value="2">2 空格</button>
          <button data-value="4">4 空格</button>
          <button data-value="8">Tab</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt-label">关键字</span>
        <div class="seg" id="segCase" role="group" aria-label="关键字大小写">
          <button data-value="upper">大写</button>
          <button data-value="lower">小写</button>
          <button data-value="keep">保持原样</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt-label">折行</span>
        <div class="seg" id="segWrap" role="group" aria-label="折行宽度">
          <button data-value="80">80 列</button>
          <button data-value="100">100 列</button>
          <button data-value="0">不折行</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt-label">AND / OR</span>
        <div class="seg" id="segAnd" role="group" aria-label="AND OR 换行">
          <button data-value="break">换行</button>
          <button data-value="inline">同行</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="sampleBtn">示例</button>
      <button class="btn" id="clearBtn">清空</button>
      <button class="btn" id="fullBtn">全屏</button>
      <button class="btn primary" id="formatBtn">格式化 <kbd data-kbd>⌘⏎</kbd></button>
    </div>
  </div>

  <main class="panes asym">
    <section class="pane">
      <div class="pane-head">
        <span class="pane-title">输入</span>
        <span class="hint">支持拖入 .sql 文件</span>
      </div>
      <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off"
        placeholder="SELECT id, name FROM users WHERE age > 18;"></textarea>
      <div class="warn" id="warn"></div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <span class="pane-title">格式化结果</span>
        <div class="pane-tools">
          <span class="stats" id="stats"></span>
          <button class="btn tiny" id="copyBtn">复制</button>
          <button class="btn tiny" id="downloadBtn">下载</button>
        </div>
      </div>
      <div class="out" id="out"></div>
    </section>
  </main>

</div>

<script src="sql-1.js"></script>
  <script src="../state-bridge.js"></script>
</body>
</html>
