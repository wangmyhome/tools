<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --run:#33d6e6; --ok:#54d673; --fail:#eb5259; --warn:#f2a340;
    --ink:#e9ebf0; --dim:rgba(255,255,255,.38); --dim2:rgba(255,255,255,.45);
    --ease-out:cubic-bezier(0.22, 1, 0.36, 1);
    --anim-dur:0.32s;
    --pill-h:32px;
    --pill-gap:5px;
  }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; user-select:none; }
  #island{
    position:absolute; inset:0;
    visibility:hidden;
    font-family: ui-rounded, -apple-system, "PingFang SC", sans-serif;
    color:var(--ink);
  }
  #island.show{ visibility:visible; }

  /* 药丸钉在窗口底中（常规）或顶中（贴顶翻面），展开/收起只动箭头，不动药丸盒 */
  #pill{
    position:absolute; left:50%; bottom:0;
    transform:translateX(-50%) translateZ(0);
    display:flex; align-items:center; gap:8px;
    height:var(--pill-h); padding:0 15px; border-radius:16px;
    background:rgba(58,58,62,.78);
    border:1px solid rgba(255,255,255,.10);
    white-space:nowrap; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    outline:none;
    transition:none;
    backface-visibility:hidden;
    z-index:2;
  }
  body.flipped-layout #pill{
    top:8px; bottom:auto;
  }
  #pill .word{ font-size:13px; font-weight:700; color:#fff; letter-spacing:.3px; }
  #pill .chev{
    width:10px; height:10px; margin-left:2px; flex:none;
    display:flex; align-items:center; justify-content:center;
    transition:transform var(--anim-dur) var(--ease-out);
    transform:rotate(0deg);
    pointer-events:none;
  }
  #pill .chev svg{ display:block; }
  body.expanded:not(.flipped-layout) #pill .chev{ transform:rotate(180deg); }

  .icon{ width:19px; height:19px; border-radius:50%; flex:none; position:relative;
         display:flex; align-items:center; justify-content:center;
         font-size:11px; font-weight:800; color:#fff; }
  .icon.ring{
    width:12px; height:12px; padding:0; box-sizing:border-box;
    background:transparent !important; border:2px solid currentColor;
  }
  .icon.spin{ background:transparent !important; }
  .icon.spin::before{
    content:''; position:absolute; inset:-2px; border-radius:50%;
    background:conic-gradient(var(--run), var(--ok), var(--warn), var(--fail), #c069f0, var(--run));
    filter:blur(3px); opacity:.85; animation:spin 1s linear infinite;
  }
  .icon.spin .ring{
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(var(--run), var(--ok), var(--warn), var(--fail), #c069f0, var(--run));
    -webkit-mask:radial-gradient(circle at center, transparent 3.5px, #000 4px);
            mask:radial-gradient(circle at center, transparent 3.5px, #000 4px);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .icon.breath{ animation: breath 1.2s ease-in-out infinite; }

  #panelWrap{
    position:absolute; left:50%;
    bottom:calc(var(--pill-h) + var(--pill-gap));
    transform:translateX(-50%);
    width:320px;
    display:grid;
    grid-template-rows:0fr;
    min-height:0;
    overflow:hidden;
    z-index:1;
    transition:grid-template-rows var(--anim-dur) var(--ease-out);
  }
  body.flipped-layout #panelWrap{
    top:calc(8px + var(--pill-h) + var(--pill-gap));
    bottom:auto;
  }
  body.expanded #panelWrap{ grid-template-rows:1fr; }

  #panel{
    overflow:hidden;
    min-height:0;
    width:312px;
    box-sizing:border-box;
    background:rgba(22,24,30,.94);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:8px 10px 6px;
    opacity:0;
    transform:translateY(6px);
    transform-origin:center bottom;
    transition:
      opacity calc(var(--anim-dur) * 0.85) ease,
      transform var(--anim-dur) var(--ease-out);
  }
  body.flipped-layout #panel{ transform-origin:center top; }
  body.expanded #panel{
    opacity:1;
    transform:translateY(0);
    overflow-x:hidden;
    overflow-y:visible;
  }
  body.expanded #panel[data-scroll="1"]{ overflow-y:auto; }
  body.animating #panel{ pointer-events:none; }
  #panel::-webkit-scrollbar{ width:0; height:0; }

  .sec{ font-size:10px; font-weight:700; letter-spacing:.5px; color:var(--dim);
        padding:0 2px 5px; }
  .row{ display:flex; align-items:center; gap:9px; padding:5px 2px; }
  .row + .row{ border-top:1px solid rgba(255,255,255,.08); }
  .dot{ width:11px; height:11px; border-radius:50%; flex:none;
        display:flex; align-items:center; justify-content:center;
        font-size:7.5px; font-weight:800; color:#fff; }
  .dot.on{ animation: breath 1.2s ease-in-out infinite; }
  @keyframes breath{
    0%,100%{ box-shadow:0 0 0 0 currentColor; opacity:.75; }
    50%    { box-shadow:0 0 7px 2px currentColor; opacity:1; }
  }
  .main{ min-width:0; flex:1; }
  .name{ display:block; font-size:12.5px; font-weight:600; line-height:1.25;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder{ display:block; font-size:10.5px;
           color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side{ flex:none; text-align:right; }
  .label{ font-size:10.5px; font-weight:700; line-height:1.3; }
  .dur{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:10px;
        color:var(--dim2); font-variant-numeric:tabular-nums; }
  .empty{ padding:10px 4px 6px; font-size:12px; color:var(--dim); text-align:center; }
</style>
</head>
<body>
<div id="island">
  <div id="panelWrap">
    <div id="panel">
      <div class="sec">最近任务</div>
      <div id="rows"></div>
    </div>
  </div>
  <div id="pill" role="button" tabindex="0" aria-expanded="false">
    <span class="icon" id="pillIcon"></span>
    <span class="word" id="pillWord">空闲</span>
    <span class="chev" id="pillChev" aria-hidden="true">
      <svg viewBox="0 0 12 12" width="10" height="10" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.75 4.75 L6 8.25 L9.25 4.75" fill="none" stroke="rgba(255,255,255,.82)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </div>
</div>
<script>
const island = document.getElementById('island');
const panelWrap = document.getElementById('panelWrap');
const panel = document.getElementById('panel');
const rows = document.getElementById('rows');
const pill = document.getElementById('pill');
const pillIcon = document.getElementById('pillIcon');
const pillWord = document.getElementById('pillWord');
let rowsData = [], pillData = null;
let tick = null;
let cachedExpandedH = 0;
let lastReportSig = '';
let animating = false;
let interactTimer = null;
let fixedWindowH = 0;
const CARD_W = 328;
const ANIM_MS = 340;

function fmt(ms){
  const v = Math.max(0, Math.floor(ms / 1000));
  if(v >= 3600) return Math.floor(v/3600) + ':' + String(Math.floor(v%3600/60)).padStart(2,'0') + ':' + String(v%60).padStart(2,'0');
  return Math.floor(v/60) + ':' + String(v%60).padStart(2,'0');
}
function elapsed(r, now){
  if(r.active && r.startedAt) return fmt(now - r.startedAt);
  if(r.durationMs != null) return fmt(r.durationMs);
  if(r.startedAt && r.endedAt) return fmt(r.endedAt - r.startedAt);
  return '--';
}

let pillSig = '';
function renderPill(){
  if(animating) return;
  const p = pillData;
  if(!p){ island.classList.remove('show'); pillSig = ''; return; }
  island.classList.add('show');
  const sig = [p.spin ? 'spin' : (p.ring ? 'ring' : (p.check ? 'check' : 'dot')),
               p.color || '', p.word || ''].join('|');
  if(sig === pillSig) return;
  pillSig = sig;
  if(p.spin){
    pillIcon.style.background = 'transparent';
    pillIcon.className = 'icon spin';
    pillIcon.innerHTML = '<span class="ring"></span>';
  } else if(p.ring){
    pillIcon.innerHTML = '';
    pillIcon.style.background = 'transparent';
    pillIcon.style.color = p.color;
    pillIcon.className = 'icon ring';
    pillIcon.textContent = '';
  } else if(p.check){
    pillIcon.innerHTML = '';
    pillIcon.style.background = p.color; pillIcon.style.color = p.color;
    pillIcon.className = 'icon'; pillIcon.textContent = '✓';
  } else {
    pillIcon.innerHTML = '';
    pillIcon.style.background = p.color; pillIcon.style.color = p.color;
    pillIcon.className = 'icon' + (p.on ? ' breath' : '');
    pillIcon.textContent = '';
  }
  pillWord.textContent = p.word;
}

function renderRows(){
  const now = Date.now();
  if(!rowsData.length){
    rows.innerHTML = '<div class="empty">Codex 没有正在跑的任务</div>';
    return;
  }
  rows.innerHTML = rowsData.map(r => `
    <div class="row">
      <span class="dot ${r.active ? 'on' : ''}" style="background:${r.color}; color:${r.color};
            ${r.active ? '' : 'opacity:.9'}">${r.active ? '' : (r.color === '#54d673' ? '✓' : '')}</span>
      <span class="main">
        <span class="name">${esc(r.name)}</span>
        ${r.folder && r.folder !== r.name ? `<span class="folder">${esc(r.folder)}</span>` : ''}
      </span>
      <span class="side">
        <span class="label" style="color:${r.color}">${esc(r.label)}</span>
        <span class="dur">${elapsed(r, now)}</span>
      </span>
    </div>`).join('');
}

function esc(s){ const d = document.createElement('span'); d.textContent = String(s || ''); return d.innerHTML; }

function isFlippedLayout(){ return document.body.classList.contains('flipped-layout'); }
function setFlippedDom(flipped){ document.body.classList.toggle('flipped-layout', !!flipped); }

function measurePanelBlockH(){
  const prevVis = panel.style.visibility;
  panel.style.visibility = 'hidden';
  const h = panel.scrollHeight;
  panel.style.visibility = prevVis;
  return h;
}

function refreshExpandedHeightCache(flipped){
  renderRows();
  if(flipped !== undefined) setFlippedDom(flipped);
  const panelH = document.body.classList.contains('expanded')
    ? panel.scrollHeight
    : measurePanelBlockH();
  cachedExpandedH = Math.ceil(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pill-h')) + 5 + panelH);
  return cachedExpandedH;
}

function neededWindowH(){
  refreshExpandedHeightCache();
  const pillH = pill.offsetHeight || 32;
  return Math.max(pillH + 8, cachedExpandedH + 8);
}

function pillRect(){
  const pr = pill.getBoundingClientRect();
  return { x: pr.left, y: pr.top, w: pr.width, h: pr.height };
}

function sendWindowSize(h, opts){
  const hh = Math.max(30, Math.round(h));
  const flip = opts && opts.flipped !== undefined ? !!opts.flipped : isFlippedLayout();
  const sig = CARD_W + '|' + hh + '|' + cachedExpandedH + '|' + (flip ? 1 : 0);
  if(!opts || !opts.force){ if(sig === lastReportSig) return; }
  lastReportSig = sig;
  try { window.yaliya.cardSize(CARD_W, hh, pillRect(), cachedExpandedH, flip); } catch {}
}

/* 展开/收起不改窗口高：药丸在窗内坐标恒定，只有列表与箭头动 */
function ensureFixedWindow(opts){
  if(animating && !(opts && opts.force)) return;
  const need = neededWindowH();
  if(need <= fixedWindowH && fixedWindowH && !(opts && opts.force)) return;
  fixedWindowH = Math.max(fixedWindowH, need);
  lastReportSig = '';
  sendWindowSize(fixedWindowH, {
    flipped: opts && opts.flipped !== undefined ? opts.flipped : isFlippedLayout(),
    force: true,
  });
}

function renderAll(){
  if(animating){ renderPill(); return; }
  renderPill();
  refreshExpandedHeightCache();
  if(document.body.classList.contains('expanded')) renderRows();
  ensureFixedWindow();
}

function applyLayoutFlags(flipped, maxH){
  if(maxH > 0){
    panel.style.maxHeight = Math.round(maxH) + 'px';
    panel.dataset.scroll = '1';
  } else {
    panel.style.maxHeight = '';
    delete panel.dataset.scroll;
  }
}

function endInteract(){
  if(interactTimer) clearTimeout(interactTimer);
  interactTimer = setTimeout(() => {
    interactTimer = null;
    document.body.classList.remove('animating');
    animating = false;
    renderPill();
  }, ANIM_MS + 24);
}

function runExpand(flipped, maxH){
  if(interactTimer){ clearTimeout(interactTimer); interactTimer = null; }
  animating = true;
  document.body.classList.add('animating');
  applyLayoutFlags(flipped, maxH);
  setFlippedDom(flipped);
  refreshExpandedHeightCache(flipped);
  renderRows();
  ensureFixedWindow({ flipped, force: true });
  document.body.classList.add('expanded');
  pill.setAttribute('aria-expanded', 'true');
  if(!tick) tick = setInterval(() => {
    if(!animating && document.body.classList.contains('expanded')) renderRows();
  }, 1000);
  endInteract();
}

function runCollapse(){
  if(!document.body.classList.contains('expanded')) return;
  if(interactTimer){ clearTimeout(interactTimer); interactTimer = null; }
  animating = true;
  document.body.classList.add('animating');
  document.body.classList.remove('expanded');
  pill.setAttribute('aria-expanded', 'false');
  if(tick){ clearInterval(tick); tick = null; }
  panel.style.maxHeight = '';
  delete panel.dataset.scroll;
  endInteract();
}

function toggleCardExpand(){
  const expanded = document.body.classList.contains('expanded');
  try { window.yaliya.cardExpand(!expanded); } catch {}
}
pill.addEventListener('click', e => {
  e.preventDefault();
  e.stopPropagation();
  toggleCardExpand();
});
pill.addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCardExpand(); }
});

window.yaliya.onCardData(d => {
  rowsData = (d && d.rows) || [];
  pillData = (d && d.pill) || null;
  renderAll();
});

window.yaliya.onCardShow(d => {
  const on = d && typeof d === 'object' ? !!d.expanded : !!d;
  const flipped = d && typeof d === 'object' ? !!d.flipped : false;
  const maxH = d && typeof d === 'object' ? (Number(d.maxH) || 0) : 0;
  island.classList.add('show');
  if(on) runExpand(flipped, maxH);
  else runCollapse();
});

/* 首帧量测：card:size 上报前主进程穿透命中依赖兜底矩形，但仍需尽快上报真实 pill 框 */
requestAnimationFrame(() => {
  island.classList.add('show');
  lastReportSig = '';
  ensureFixedWindow({ force: true });
});
/* 主进程改窗高（首帧 48→200 等）后药丸的窗内 y 会变（窗底锚定），
   必须重报命中矩形——否则主进程命中区停在旧 y，点药丸穿透没反应 */
window.addEventListener('resize', () => {
  lastReportSig = '';
  ensureFixedWindow({ force: true });
});
</script>
</body>
</html>
