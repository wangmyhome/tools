<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 编辑预览 · DevToolbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M8 22V10l6 6 6-6v12' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/app.css?v=202610271643">
<script src="../js/app.js?v=202610271643"></script>
<script src="../js/vendor/marked.min.js?v=202610271643"></script>
<style>
  .md-pane { min-height: 460px; }

  /* 仅编辑 / 仅预览：单栏铺满整个工具区 */
  body.view-edit .panes,
  body.view-preview .panes { grid-template-columns: 1fr; }
  body.view-edit .md-pane,
  body.view-preview .md-pane { min-height: 0; }
  .stats-sep { color: var(--border); }

  /* ---------- Typora 式：预览可直接编辑 ---------- */
  .md-body[contenteditable="true"] { outline: none; cursor: text; }
  .md-body[contenteditable="true"]:focus { box-shadow: inset 0 0 0 1px var(--accent-soft); }
  .md-body[contenteditable="true"]:empty::before {
    content: "在这里直接输入，和 Typora 一样所见即所得…";
    color: var(--muted); opacity: .7;
  }
  .md-body .md-active-block { background: rgba(127,127,127,.06); border-radius: 6px; }

  /* ---------- 大纲 ---------- */
  #previewPane { position: relative; }
  .outline {
    position: absolute;
    top: 54px; right: 12px; bottom: 12px;
    width: 190px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 30px -18px rgba(0,0,0,.75);
    transform: translateX(12px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
    z-index: 5;
    overflow: hidden;
  }
  .outline.open { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .outline-head {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border-soft);
  }
  .outline-close {
    border: 0; background: transparent; color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer; padding: 0 2px;
  }
  .outline-close:hover { color: var(--fg); }
  .outline-list {
    flex: 1 1 auto; overflow: auto; padding: 6px;
    font-size: 12.5px;
  }
  .outline-item {
    display: block;
    padding: 4px 8px;
    border-radius: 6px;
    color: var(--muted);
    text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .outline-item:hover { color: var(--fg); background: var(--panel-head); }
  .outline-item.active { color: var(--fg-strong); border-left-color: var(--accent); background: var(--accent-soft); }
  .outline-item .lvl-1 { font-weight: 600; }
  .outline-empty { padding: 10px 8px; color: var(--muted); font-size: 12px; }

</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <a class="brand-link" href="../index.html" title="返回首页">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 18V7l4 5 4-5v11"/>
          </svg>
        </div>
        <div>
          <h1>Markdown 编辑预览</h1>
          <p class="sub">左边写、右边看；草稿自动保存在本机</p>
        </div>
      </a>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="切换浅色 / 深色" aria-label="切换主题">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="opts">
      <div class="opt">
        <span class="opt-label">视图</span>
        <div class="seg" id="segView" role="group" aria-label="视图模式">
          <button data-value="both">分栏</button>
          <button data-value="edit">仅编辑</button>
          <button data-value="preview">仅预览</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt-label">换行</span>
        <div class="seg" id="segBreak" role="group" aria-label="单换行处理">
          <button data-value="soft">同段落</button>
          <button data-value="hard">强制换行</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="sampleBtn">示例</button>
      <button class="btn" id="clearBtn">清空</button>
      <button class="btn" id="copyMdBtn">复制 MD</button>
      <button class="btn" id="copyHtmlBtn">复制 HTML</button>
      <button class="btn" id="fullBtn">全屏</button>
      <button class="btn primary" id="downloadBtn">下载 .md</button>
    </div>
  </div>

  <main class="panes">
    <section class="pane md-pane" id="editPane">
      <div class="pane-head">
        <span class="pane-title">Markdown</span>
        <div class="pane-tools"><span class="stats" id="statsMd"></span></div>
      </div>
      <textarea id="editor" spellcheck="false"
        placeholder="# 标题&#10;&#10;**加粗**、*斜体*、`行内代码`&#10;&#10;- 列表项&#10;- 另一项"></textarea>
    </section>

    <section class="pane md-pane" id="previewPane">
      <div class="pane-head">
        <span class="pane-title">预览</span>
        <div class="pane-tools">
          <span class="stats" id="statsHtml"></span>
          <button class="btn tiny" id="tocBtn" aria-pressed="false">目录</button>
        </div>
      </div>
      <div class="md-body" id="preview" contenteditable="true" spellcheck="false"
           role="textbox" aria-multiline="true" aria-label="可直接编辑的预览区"></div>
      <aside class="outline" id="outline" aria-hidden="true">
        <div class="outline-head">
          <span>目录</span>
          <button class="outline-close" id="outlineClose" title="收起">×</button>
        </div>
        <div class="outline-list" id="outlineList"></div>
      </aside>
    </section>
  </main>
</div>

<script src="md-1.js"></script>
  <script src="../state-bridge.js"></script>
</body>
</html>
